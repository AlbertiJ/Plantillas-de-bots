<!DOCTYPE html>
<html lang="es-AR" data-tema="azul" data-modo="claro" data-fontsize="normal" data-font="system">
<head>
    <meta charset="UTF-8">
    <!-- FIX #11: viewport para mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar clave — Plantillas de bots</title>
    <link rel="stylesheet" href="/static/style-colors.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <script src="/static/brightness.js"></script>
</head>
<body>
    <div class="login-container">
        <h1>Cambiar tu clave</h1>
        <p class="muted">Es la primera vez que entrás (o el admin la reseteo). Elegí una clave nueva de al menos 8 caracteres.</p>

        <form id="change-form">
            <label>Clave actual
                <input type="password" name="old_password" required autofocus>
            </label>
            <label>Clave nueva (mínimo 8 chars)
                <input type="password" name="new_password" required minlength="8">
            </label>
            <label>Repetir clave nueva
                <input type="password" name="confirm_password" required minlength="8">
            </label>
            <button type="submit">Cambiar y entrar</button>
        </form>

        <div id="change-error" class="err" hidden></div>
    </div>

    <script>
        const form = document.getElementById("change-form");
        const err = document.getElementById("change-error");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            err.hidden = true;

            const oldPw = form.old_password.value;
            const newPw = form.new_password.value;
            const confirmPw = form.confirm_password.value;

            if (newPw !== confirmPw) {
                err.textContent = "Las claves nuevas no coinciden";
                err.hidden = false;
                return;
            }
            if (newPw.length < 8) {
                err.textContent = "La clave nueva debe tener al menos 8 caracteres";
                err.hidden = false;
                return;
            }
            if (newPw === oldPw) {
                err.textContent = "La clave nueva debe ser distinta de la actual";
                err.hidden = false;
                return;
            }

            const resp = await fetch("/api/auth/change", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({old_password: oldPw, new_password: newPw}),
            });

            if (resp.ok) {
                window.location.href = "/admin";
            } else {
                const body = await resp.json();
                err.textContent = body.detail || "Error al cambiar la clave";
                err.hidden = false;
            }
        });
    </script>
</body>
</html>
